<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <form>
    <label for="name">Full Name:</label>
    <input
    type="text"
    id="name"
    />
    <label for="email">Email: </label>
    <input
    type="email"
    id="email"
    />

    <label for="position">Job:</label>
    <select id="position">
        <option> Doctor </option>
        <option> Lawyer </option>
        <option> SwagMaster</option>
    </select>

    <label for="availability">When Can You Work:</label>
    <fieldset class="radio-group">
    <legend>Availability</legend>
    <input id="full-time" type="radio" name="availability" value="full-time">
    <label for="full-time">Full Time</label>

    <input id="part-time" type="radio" name="availability" value="part-time">
    <label for="part-time">Part Time</label>

    <input id="seasonal" type="radio" name="availability" value="seasonal">
    <label for="seasonal">Seasonal</label>
</fieldset>

    <label for="message">Comments:</label>
    <textarea id="message">
    </textarea>
    <button type=submit>Submit</button>
    </form>
    
</div>
</body>
</html>
