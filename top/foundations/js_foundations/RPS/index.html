<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <div class="button-container">
        <h2>Pick Your Choice</h2>
        <button id="rock" class="btn rock">Rock</button>
        <button id="paper" class="btn paper">Paper</button>
        <button id="scissors" class="btn scissors">Scissors</button>
        <button id="play" class="btn play">Play Game</button>
    </div>
    
  

    <div class="results">
        <h2>Results: <span>Human Score: </span><span id="humanScore"">0</span><span> - </span><span>Computer Score: </span> <span id="computerScore"> 0</span></h2>
    </div>
</body>
</html>
