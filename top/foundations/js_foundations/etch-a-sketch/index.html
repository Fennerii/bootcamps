<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6/css/font-awesome.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Coloring Blocks</h1>
    <div class="main">
    <div class="square-container">
        
    </div>

    <div class="color-container">
        <div class="color red"></div>
        <div class="color orange"></div>
        <div class="color yellow"></div>
        <div class="color green"></div>
        <div class="color blue"></div>
        <div class="color indigo"></div>
        <div class="color violet"></div>
        <div class="color black"></div>
        <div class="color brown"></div>
        <div class="color eraser">
            <img src="icons/eraser.svg" alt="eraser" class="icon">
        </div>
        <div class="color brush">
            <img src="icons/brush.svg" alt="brush" class="icon">
        </div>
        <div class="color reset">
            <img src="icons/rotate.svg" alt="reset" class="icon">
        </div>

    </div>
    </div>
</body>
</html>
