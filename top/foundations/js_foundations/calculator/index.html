<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calc-body">
        <div class="screen"></div>

        <div class="container">
            <button class="num one">1</button>
            <button class="num two">2</button>
            <button class="num three">3</button>
            <button class="num four">4</button>
            <button class="num five">5</button>
            <button class="num six">6</button>
            <button class="operation add">+</button>
            <button class="operation subtract">-</button>
            <button class="num seven">7</button>
            <button class="num eight">8</button>
            <button class="operation multiply">x</button>
            <button class="operation division">/</button>
            <button class="num nine">9</button>
            <button class="num zero">0</button>
            <button class="operation modulo">%</button>
            <button class="operation equals">=</button>
            <button class="pi misc">π</button>
            <button class="negpos misc">+/-</button>
            <button class="exponent misc">x^y</button>
            <button class="operation clear">C</button>


        </div>
    </div>
    
 
</body>
</html>
